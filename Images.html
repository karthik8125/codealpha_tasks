<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: sans-serif;
    background-color: #f4f4f9;
    padding: 20px;
}
.gallery-title {
    text-align: center;
    margin: 20px 0;
    color: #333;
}
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    max-width: 1200px;
    margin: 0 auto;
}
.gallery-item {
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    background-color: #ddd;
    aspect-ratio: 4 / 3;
}
.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease, filter 0.4s ease;
}
.gallery-item:hover img {
    transform: scale(1.08);
    filter: brightness(80%);
}
.lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 1000;
}
.lightbox.active {
    opacity: 1;
    pointer-events: auto;
}
.lightbox-content {
    max-width: 85%;
    max-height: 80%;
    text-align: center;
    position: relative;
}
.lightbox-content img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 4px;
    transform: scale(0.95);
    transition: transform 0.4s ease;
}
.lightbox.active .lightbox-content img {
    transform: scale(1);
}
.lightbox-caption {
    color: #fff;
    margin-top: 10px;
    font-size: 1.1rem;
}
.close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    color: #fff;
    font-size: 40px;
    cursor: pointer;
    transition: color 0.2s;
}
.close-btn:hover {
    color: #ff4d4d;
}
.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: none;
    font-size: 24px;
    padding: 15px 20px;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s;
    user-select: none;
}
.nav-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}
.prev-btn { left: 20px; }
.next-btn { right: 20px; }
@media (max-width: 600px) {
    .nav-btn {
        padding: 10px 15px;
        font-size: 18px;
    }
    .prev-btn { left: 5px; }
    .next-btn { right: 5px; }
}
</style>
</head>
<body>
    <main class="gallery-container">
        <h1 class="gallery-title">Photo Gallery</h1>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://images.pexels.com/photos/371633/pexels-photo-371633.jpeg?cs=srgb&dl=clouds-country-daylight-371633.jpg&fm=jpg" alt="Beautiful Landscape"></div>
            <div class="gallery-item"><img src="https://wallpaperaccess.com/full/327627.jpg" alt="Ocean Waves"></div>
            <div class="gallery-item"><img src="https://wallpapers.com/images/hd/golden-summit-at-dusk-mountain-peak-7gkmetyromdj4u43.jpg" alt="Mountain Peak"></div>
            <div class="gallery-item"><img src="https://wallpaperaccess.com/full/1782078.jpg" alt="Dense Forest"></div>
            <div class="gallery-item"><img src="https://images.pexels.com/photos/421927/pexels-photo-421927.jpeg?cs=srgb&dl=pexels-chris-schippers-139261-421927.jpg&fm=jpg" alt="City Skyline"></div>
            <div class="gallery-item"><img src="https://images.pexels.com/photos/998653/pexels-photo-998653.jpeg?cs=srgb&dl=pexels-francesco-ungaro-998653.jpg&fm=jpg" alt="Desert Dunes"></div>
            <div class="gallery-item"><img src="https://wallpaperswide.com/download/lamborghini_fenomeno_super_sports_car-wallpaper-2560x1600.jpg" alt="Sports Car"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDIxfHx8ZW58MHx8fHx8" alt="Sports Bike"></div>
    </main>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="">
            <div class="lightbox-caption" id="caption"></div>
        </div>
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>
    <script>
    const galleryItems = document.querySelectorAll('.gallery-item img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const caption = document.getElementById('caption');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentIndex = 0;
galleryItems.forEach((item, index) => {
    item.addEventListener('click', () => {
        currentIndex = index;
        updateLightbox();
        lightbox.classList.add('active');
    });
});
function updateLightbox() {
    const currentImg = galleryItems[currentIndex];
    lightboxImg.src = currentImg.src;
    caption.textContent = currentImg.alt;
}
function nextImage() {
    currentIndex = (currentIndex + 1) % galleryItems.length;
    updateLightbox();
}
function prevImage() {
    currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
    updateLightbox();
}
function closeLightbox() {
    lightbox.classList.remove('active');
}
nextBtn.addEventListener('click', nextImage);
prevBtn.addEventListener('click', prevImage);
closeBtn.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
        closeLightbox();
    }
});
document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'Escape') closeLightbox();
});
    </script>
</body>
</html>
